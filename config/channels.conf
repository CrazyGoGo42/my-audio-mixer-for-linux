# Audio Mixer channels — the one place the channel list lives.
#
# Every script reads this file: the virtual sinks, the app routing, the OSD, the
# mixer window and the "which channel?" popup all follow it. After editing, run
# `audio-routes-apply` (it restarts PipeWire when the list changed).
#
# Columns:
#   key      short name used on the command line: audio-channel-control <key> up
#   sink     PipeWire node name apps play into
#   mute / down / up
#            numpad key for Ctrl+<key> (GNOME keysym, e.g. KP_1), or - for none.
#            Only the first install uses these to create hotkeys.json; after
#            that, change hotkeys in the mixer window (right-click) or with
#            `audio-mixer hotkeys`.
#   label    shown in the OSD and the popup (may contain spaces)
#
# The channel with key "default" is the catch-all: every app that has no route
# in routes.json starts there (games included).
#
# Besides these, audio-routes-apply always adds "All Audio": an input (like a
# microphone) carrying every channel mixed together at the levels you set, for
# recording or streaming. It isn't listed here because nothing plays into it.

# key     sink            mute        down        up           label
default   Default_Audio   KP_1        KP_4        KP_7         Desktop
discord   Discord_Audio   KP_2        KP_5        KP_8         Discord
music     Music_Audio     KP_3        KP_6        KP_9         Music
browser   Browser_Audio   KP_Delete   KP_Add      KP_Subtract  Browser
