# Virtual audio sinks — Audio Mixer for Linux
#
# Five independent channels, each a PipeWire loopback sink. Per-channel volume
# lives on the "X_Audio" sink that apps connect to. Each channel's output is
# pinned to __DOWNSTREAM__, so the full chain is:
#
#     App -> X_Audio (volume) -> __DOWNSTREAM__ -> hardware
#
# __DOWNSTREAM__ is substituted by install.sh: "easyeffects_sink" when
# EasyEffects is present, otherwise the hardware sink. The audio-router-daemon
# re-asserts this link if EasyEffects starts late or restarts.
#
# NOTE: keep each *.props block on a single line. The SPA config parser used by
# PipeWire 1.0.x silently drops later modules if a props block is split across
# multiple lines, which is why this file looks dense.

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Games Audio"
            capture.props = { node.name = "Games_Audio" media.class = "Audio/Sink" audio.position = [ FL FR ] }
            playback.props = { node.name = "Games_Audio_out" node.passive = true target.object = "__DOWNSTREAM__" }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Discord Audio"
            capture.props = { node.name = "Discord_Audio" media.class = "Audio/Sink" audio.position = [ FL FR ] }
            playback.props = { node.name = "Discord_Audio_out" node.passive = true target.object = "__DOWNSTREAM__" }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Music Audio"
            capture.props = { node.name = "Music_Audio" media.class = "Audio/Sink" audio.position = [ FL FR ] }
            playback.props = { node.name = "Music_Audio_out" node.passive = true target.object = "__DOWNSTREAM__" }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Browser Audio"
            capture.props = { node.name = "Browser_Audio" media.class = "Audio/Sink" audio.position = [ FL FR ] }
            playback.props = { node.name = "Browser_Audio_out" node.passive = true target.object = "__DOWNSTREAM__" }
        }
    }
    # Default — catch-all for apps not yet assigned a channel. The routing config
    # makes this the default target, so unrecognised apps land here (attenuated
    # and safe) instead of blasting straight out of the hardware.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Default Audio"
            capture.props = { node.name = "Default_Audio" media.class = "Audio/Sink" audio.position = [ FL FR ] }
            playback.props = { node.name = "Default_Audio_out" node.passive = true target.object = "__DOWNSTREAM__" }
        }
    }
]
