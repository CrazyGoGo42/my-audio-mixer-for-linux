# Engine spike — a standalone PipeWire client (run with `pipewire -c`), so the
# system config is never touched. Proves the mechanisms the mixer engine needs:
# a filter-chain channel whose output WirePlumber leaves alone
# (node.autoconnect = false) and whose Bass/Treble are live parameters, plus a
# loopback whose capture side we link by hand. See engine-spike.sh.

context.properties = { log.level = 2 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Spike Channel"
            media.name = "Spike Channel"
            filter.graph = {
                nodes = [
                    { type = builtin name = bass label = bq_lowshelf control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = treble label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [ { output = "bass:Out" input = "treble:In" } ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = { node.name = "spike_ch" media.class = "Audio/Sink" audio.position = [ FL FR ] }
            playback.props = { node.name = "spike_ch_out" node.passive = true node.autoconnect = false }
        }
    }
    {   name = libpipewire-module-loopback
        flags = [ nofail ]
        args = {
            node.description = "Spike Mix"
            capture.props = { node.name = "spike_mix_in" node.autoconnect = false node.passive = true audio.position = [ FL FR ] }
            playback.props = { node.name = "spike_mix" media.class = "Audio/Source" audio.position = [ FL FR ] }
        }
    }
]
